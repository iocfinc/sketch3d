<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFF00"/>
      <stop offset="100%" stop-color="#d4d400"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF66D9"/>
      <stop offset="100%" stop-color="#b82d92"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#73E6F1"/>
      <stop offset="100%" stop-color="#2894a0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e1e2a" stroke-width="4"/>

  <!-- Subtle Print Bed Grid -->
  <g stroke="#00E56D" stroke-width="1.5" stroke-opacity="0.2">
    <line x1="96" y1="360" x2="416" y2="360"/>
    <line x1="96" y1="400" x2="416" y2="400"/>
    <line x1="96" y1="440" x2="416" y2="440"/>
    <line x1="160" y1="330" x2="160" y2="470"/>
    <line x1="256" y1="330" x2="256" y2="470"/>
    <line x1="352" y1="330" x2="352" y2="470"/>
  </g>

  <!-- 3D Isometric Extruded Hexagon Shape -->
  <g filter="url(#neonGlow)" transform="translate(0, -18)">
    <!-- Top Face (Yellow) -->
    <polygon points="256,90 380,162 256,234 132,162" fill="url(#topFace)"/>
    <!-- Left Face (Pink) -->
    <polygon points="132,162 256,234 256,358 132,286" fill="url(#leftFace)"/>
    <!-- Right Face (Cyan) -->
    <polygon points="256,234 380,162 380,286 256,358" fill="url(#rightFace)"/>

    <!-- Inner Core Cutout (Dark Void) -->
    <polygon points="256,134 326,174 256,214 186,174" fill="#020203" stroke="#00E56D" stroke-width="3"/>

    <!-- Wireframe Highlights -->
    <polyline points="132,162 256,90 380,162 256,234 132,162" fill="none" stroke="#FEFF00" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="256" y1="234" x2="256" y2="358" stroke="#00E56D" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="132,162 132,286 256,358 380,286 380,162" fill="none" stroke="#73E6F1" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Bambu Green Base Accent -->
  <path d="M 120 448 L 392 448" stroke="#00E56D" stroke-width="6" stroke-linecap="round"/>
</svg>
